name: Canli Galaktik Istihbarat Ussu

on:
  schedule:
    # Günde 4 kritik seans/saat tetikleme
    - cron: '0 7,10,13,16 * * 1-5'
  workflow_dispatch: # İstediğin an manuel tetikleme

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Depodan Cek
        uses: actions/checkout@v3

      - name: Python Ortamini Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          pip install requests

      - name: Galaktik Raporu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
