name: Canli Galaktik Istihbarat Ussu

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-5'
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install pandas yfinance requests feedparser
      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python firsat.py
