name: Canli Galaktik Istihbarat Ussu

on:
  workflow_dispatch: # İstediğiniz an manuel çalıştırma butonu
  schedule:
    # TSİ 09:45 (Açılış) - UTC 06:45
    - cron: '45 6 * * 1-5'
    # TSİ 12:30 (Öğle) - UTC 09:30
    - cron: '30 9 * * 1-5'
    # TSİ 15:30 (Gün Ortası) - UTC 12:30
    - cron: '30 12 * * 1-5'
    # TSİ 18:15 (Kapanış) - UTC 15:15
    - cron: '15 15 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoriyi Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install yfinance pandas requests

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
