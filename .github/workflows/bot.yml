name: BIST Fırsat Avcısı

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7-15 * * 1-5' # Hafta içi her gün mesai saatlerinde çalışır

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install yfinance pandas requests feedparser

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python firsat.py
